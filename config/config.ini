[DEFAULT]
# 录制设置
record_format = ts
video_quality = origin
segment_time = 1800
max_retries = 3
retry_delay = 10

# 监控设置
monitor_interval = 120
check_timeout = 15

# 存储设置
output_dir = /app/recordings
max_disk_usage = 90

# 服务器设置
host = 0.0.0.0
port = 8000

# 通知设置
enable_notification = false
webhook_url =

# 代理设置 (录制海外平台时需要)
enable_proxy = false
proxy_addr =

# 抖音Cookie (可选，提高稳定性)
douyin_cookie =
