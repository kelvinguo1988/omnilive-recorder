services:
  live-recorder:
    build:
      context: .
      # 本地构建走阿里云源加速（GitHub Actions 不传 args，使用官方源）
      args:
        - APT_MIRROR=mirrors.aliyun.com
        - PIP_INDEX=https://mirrors.aliyun.com/pypi/simple/
    container_name: live-recorder
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 录制文件持久化: 使用 named volume, docker compose up 时由 Docker 自动在
      # NAS 盘的 Docker 卷目录创建 (数据根目录位于 CACHEDEV1_DATA 存储池),
      # 文件直接落 NAS, 不占容器磁盘 (与 bililiverecorder 行为一致)。
      - omni-recordings:/app/recordings
      # 数据库持久化
      - ./data:/app/data
      # 配置文件
      - ./config:/app/config:ro
      # 日志
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.ini
    # 资源限制 (可按需调整)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  # 录制文件卷: 不指定 external, docker compose up 时自动创建。
  # Docker 数据根目录位于 NAS 存储池 (CACHEDEV1_DATA), 故该卷物理上位于
  # /share/CACHEDEV1_DATA/Container/.../volumes/omni-recordings/_data,
  # 即自动使用 NAS 大容量盘, 与 bililiverecorder 行为一致。
  omni-recordings:
    driver: local
