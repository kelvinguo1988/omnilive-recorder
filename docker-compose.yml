services:
  live-recorder:
    build:
      context: .
      # 本地构建走阿里云源加速（GitHub Actions 不传 args，使用官方源）
      args:
        - APT_MIRROR=mirrors.aliyun.com
        - PIP_INDEX=https://mirrors.aliyun.com/pypi/simple/
    container_name: live-recorder
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 录制文件持久化。
      # 默认: 本地 ./recordings 卷。
      # NAS / 小容器磁盘: 设置 RECORDINGS_HOST_PATH 指向 NAS 真实目录后启动,
      #   例如 RECORDINGS_HOST_PATH=/Container/.../volumes/.../_data docker compose up -d
      #   或把变量写进同目录 .env 后 docker compose up -d
      # 系统设置里 output_dir 填 /app/recordings 即可直接写入 NAS, 不占容器磁盘。
      - ${RECORDINGS_HOST_PATH:-./recordings}:/app/recordings
      # 数据库持久化
      - ./data:/app/data
      # 配置文件
      - ./config:/app/config:ro
      # 日志
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.ini
    # 资源限制 (可按需调整)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
